<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient
      id="portraitGradient"
      x1="10"
      y1="8"
      x2="54"
      y2="56"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#6FF7FF"/>
      <stop offset="0.45" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#167BFF"/>
    </linearGradient>

    <filter
      id="portraitGlow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur
        stdDeviation="1.8"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect
    x="19"
    y="8"
    width="26"
    height="48"
    rx="4"
    stroke="url(#portraitGradient)"
    stroke-width="2.5"
    filter="url(#portraitGlow)"
  />

  <rect
    x="24"
