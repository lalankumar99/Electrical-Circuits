<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient
      id="searchGradient"
      x1="12"
      y1="10"
      x2="52"
      y2="54"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#6FF7FF"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#167BFF"/>
    </linearGradient>

    <filter
      id="searchGlow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur
        stdDeviation="2.2"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle
    cx="28"
    cy="28"
    r="17"
    stroke="url(#searchGradient)"
    stroke-width="3"
    filter="url(#searchGlow)"
  />

  <circle
    cx="28"
    cy="28"
    r="11"
    stroke="#00E5FF"
    stroke-width="1"
    opacity="0.35"
  />

  <path
    d="M40 40L54 54"
    stroke="url(#searchGradient)"
    stroke-width="4"
    stroke-linecap="round"
    filter="url(#searchGlow)"
  />

  <path
    d="M40 40L54 54"
    stroke="url(#searchGradient)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <path
    d="M13 28H8"
    stroke="#00E5FF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.65"
  />

  <path
    d="M28 13V8"
    stroke="#00E5FF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.65"
  />

  <circle
    cx="8"
    cy="28"
    r="2"
    fill="#00E5FF"
  />

  <circle
    cx="28"
    cy="8"
    r="2"
    fill="#00E5FF"
  />

  <circle
    cx="54"
    cy="54"
    r="2.5"
    fill="#167BFF"
    filter="url(#searchGlow)"
  />
</svg>