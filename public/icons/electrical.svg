<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 128"
  fill="none"
>
  <defs>
    <linearGradient
      id="core"
      x1="24"
      y1="18"
      x2="104"
      y2="110"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#6FF7FF"/>
      <stop offset="0.45" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#147BFF"/>
    </linearGradient>

    <linearGradient
      id="edge"
      x1="16"
      y1="16"
      x2="112"
      y2="112"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#1677FF"/>
    </linearGradient>

    <filter
      id="glow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter
      id="softGlow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur
        stdDeviation="1.8"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

