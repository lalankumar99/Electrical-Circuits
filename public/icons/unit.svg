<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient
      id="unitGradient"
      x1="9"
      y1="8"
      x2="55"
      y2="57"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#6FF7FF"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#167BFF"/>
    </linearGradient>

    <filter
      id="unitGlow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur
        stdDeviation="2"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect
    x="10"
    y="9"
    width="44"
    height="46"
    rx="6"
    stroke="url(#unitGradient)"
    stroke-width="2.5"
    filter="url(#unitGlow)"
  />

  <path
    d="M18 19H46"
    stroke="#00E5FF"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <path
    d="M18 28H40"
    stroke="#00D9FF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.85"
  />

  <path
    d="M18 36H46"
    stroke="#00D9FF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.7"
  />

  <path
    d="M18 44H35"
    stroke="#167BFF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.65"
  />

  <circle
    cx="46"
    cy="28"
    r="3"
    fill="#00E5FF"
    filter="url(#unitGlow)"
  />

  <circle
    cx="40"
    cy="44"
    r="3"
    fill="#167BFF"
    filter="url(#unitGlow)"
  />

  <path
    d="M14 15H18"
    stroke="#00E5FF"
    stroke-width="2"
    stroke-linecap="round"
  />

  <path
    d="M46 49H50"
    stroke="#167BFF"
    stroke-width="2"
    stroke-linecap="round"
  />

  <circle
    cx="14"
    cy="15"
    r="1.8"
    fill="#00E5FF"
  />

  <circle
    cx="50"
    cy="49"
    r="1.8"
    fill="#167BFF"
  />
</svg>